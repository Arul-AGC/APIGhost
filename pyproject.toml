[project]
name = "apighost"
version = "0.1.0"
description = "Stateful BOLA Detection Engine"
authors = [
    {name = "Arul Guru Chandiran"},
    {name = "Kapil"},
    {name = "Kishore"},
    {name = "Roopesh"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "prance>=23.6.21.0",
    "openapi-spec-validator>=0.7.1",
    "typer>=0.12.3",
    "rich>=13.7.1",
    "Jinja2>=3.1.4"
]

[project.scripts]
apighost = "apighost.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
